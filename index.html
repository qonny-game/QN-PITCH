<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>QN PITCH 0.1.1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="appHeader">
  <div id="appHeaderText">
    <h1 id="appLogo"><span id="appLogoQN">QN</span>PITCH <span id="appVersion">v0.1.1</span></h1>
  </div>
  <div id="headerControls">
    <div class="header-btn-wrapper" id="qnNavWrapper">
      <button class="qn-nav-hamburger" id="qnNavHamburger" title="QN Apps">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>
      <div class="qn-nav-dropdown" id="qnNavDropdown">
        <a class="qn-nav-item" data-qn-app="player" href="https://qonny-game.github.io/QN-PLAYER/" title="QNPLAYER" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
          <span>PLAYER</span>
        </a>
        <a class="qn-nav-item" data-qn-app="tuner" href="https://qonny-game.github.io/QN-TUNER/" title="QNTUNER" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M9 3v6.28A3.5 3.5 0 1 0 11 12.7V7h4V3H9zm7 8h-2v10h2V11zm-8 0H6v10h2V11z"/></svg>
          <span>TUNER</span>
        </a>
        <a class="qn-nav-item" data-qn-app="tempo" href="https://qonny-game.github.io/QN-TEMPO/" title="QNTEMPO" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M9 2v2h6V2h2v2.06c1.14.2 2 1.2 2 2.4 0 .77-.35 1.46-.9 1.92L20 20H4l1.9-11.62A2.5 2.5 0 0 1 5 6.46c0-1.2.86-2.2 2-2.4V2h2zm2.6 6.5-1.9 9.9h2.6l1.6-8.4-2.3-1.5z"/></svg>
          <span>TEMPO</span>
        </a>
        <a class="qn-nav-item current" data-qn-app="pitch" href="https://qonny-game.github.io/QN-PITCH/" title="QNPITCH" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M3 17h3v-6H3v6zm5 3h3V9H8v11zm5-15v18h3V5h-3zm5 8v7h3v-7h-3z"/></svg>
          <span>PITCH</span>
        </a>
      </div>
    </div>
  </div>
</div>

<!-- 録音一覧モーダル（LISTボタンで開閉、画面に重ねて表示） -->
<div class="av-popup-backdrop" id="recListBackdrop"></div>
<div class="av-popup rec-list-popup" id="recListPopup">
  <p class="popup-title">Recordings</p>
  <div class="rec-list-scroll" id="recListScroll">
    <p class="rec-list-empty" id="recListEmpty">まだ録音がありません</p>
  </div>
  <button class="popup-close-btn" id="recListCloseBtn">Done</button>
</div>

<!-- ノイズ除去フィルタ設定モーダル（SETボタンで開閉） -->
<div class="av-popup-backdrop" id="settingsBackdrop"></div>
<div class="av-popup settings-popup" id="settingsPopup">
  <p class="popup-title">Filter Settings</p>

  <div class="settings-row">
    <div class="settings-row-label">
      <span class="settings-row-title">急変スキップ</span>
      <span class="settings-row-desc">直近の短時間で大きく音程が動いた区間の線を描画しない</span>
    </div>
  </div>
  <div class="settings-field">
    <label class="settings-field-label" for="jumpWindowInput">時間窓 (ms)</label>
    <input type="number" id="jumpWindowInput" class="settings-input" min="20" max="1000" step="10">
  </div>
  <div class="settings-field">
    <label class="settings-field-label" for="jumpSemitonesInput">音程変化量 (半音)</label>
    <input type="number" id="jumpSemitonesInput" class="settings-input" min="1" max="24" step="1">
  </div>

  <div class="settings-divider"></div>

  <div class="settings-row">
    <div class="settings-row-label">
      <span class="settings-row-title">スパイク除去</span>
      <span class="settings-row-desc">前後と繋がらない孤立した単発の飛び値を除去する</span>
    </div>
    <button type="button" class="settings-toggle" id="spikeToggle" role="switch" aria-checked="false"><span class="settings-toggle-knob"></span></button>
  </div>

  <div class="settings-divider"></div>

  <div class="settings-row">
    <div class="settings-row-label">
      <span class="settings-row-title">音量ゲート</span>
      <span class="settings-row-desc">これより小さい音量で検出されたピッチは無効点として扱う</span>
    </div>
  </div>
  <div class="settings-field">
    <label class="settings-field-label" for="rmsThresholdInput">最低音量 (RMS, 0〜100)</label>
    <input type="number" id="rmsThresholdInput" class="settings-input" min="0" max="100" step="1">
  </div>

  <div class="settings-btn-row">
    <button class="save-cancel-btn" id="settingsResetBtn">Reset</button>
    <button class="popup-close-btn save-ok-btn" id="settingsCloseBtn">Done</button>
  </div>
</div>

<div class="stage-wrap">
  <div class="stage-meta">
    <span class="stage-meta-label">NOTE</span>
    <span class="stage-meta-value" id="noteReadout">--</span>

    <span class="cents-readout" id="centsReadout">-- ¢</span>

    <div class="meta-div-toggle" id="clearToggle">
      <button type="button" class="meta-div-btn" id="clearBtn">CLEAR</button>
    </div>
  </div>

  <div class="pitch-roll-panel">
    <div class="pitch-roll-keys" id="rollKeys"></div>
    <div class="pitch-roll-scroll" id="rollScroll">
      <div class="pitch-roll-content" id="rollContent">
        <canvas id="rollCanvas"></canvas>
      </div>
    </div>
  </div>

  <p class="stage-hint" id="statusHint">マイク未接続 — RECを押して開始</p>
</div>

<!-- 録音停止時のファイル名確認ダイアログ -->
<div class="av-popup-backdrop" id="saveBackdrop"></div>
<div class="av-popup" id="savePopup">
  <p class="popup-title">Save Recording</p>
  <input type="text" id="saveNameInput" class="preset-name-input" maxlength="30">
  <div class="save-btn-row">
    <button class="save-cancel-btn" id="saveCancelBtn">Cancel</button>
    <button class="popup-close-btn save-ok-btn" id="saveOkBtn">OK</button>
  </div>
</div>

<!-- 一覧行のリネームダイアログ -->
<div class="av-popup-backdrop" id="renameBackdrop"></div>
<div class="av-popup" id="renamePopup">
  <p class="popup-title">Rename</p>
  <input type="text" id="renameNameInput" class="preset-name-input" maxlength="30">
  <div class="save-btn-row">
    <button class="save-cancel-btn" id="renameCancelBtn">Cancel</button>
    <button class="popup-close-btn save-ok-btn" id="renameOkBtn">OK</button>
  </div>
</div>

<!-- 下部固定トランスポート（QNAUDIO / QNTEMPOのtop-controlsに準拠） -->
<div class="top-controls" id="topControls">
  <div class="pb-info-row" id="pbInfoRow">
    <span class="pb-name" id="pbName">—</span>
    <div class="pb-progress-track"><div class="pb-progress-fill" id="pbProgressFill"></div></div>
    <button id="pbCloseBtn" class="pb-close-btn" title="Close">
      <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 7 19l5.59-5.59L17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
  <div class="top-controls-row">
    <button id="recBtn" class="loopbtn loopbtn-rec" title="Record / Stop">
      <svg id="recIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
      <span class="top-controls-btn-label" id="recLabel">REC</span>
    </button>
    <button id="playToggleBtn" class="loopbtn loopbtn-play" title="Play / Pause" disabled>
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span class="top-controls-btn-label" id="playLabel">PLAY</span>
    </button>
    <button id="listBtn" class="loopbtn loopbtn-square" title="Recordings">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h10v2H4v-2z"/></svg>
      <span class="top-controls-btn-label" id="listBtnLabel">LIST</span>
    </button>
    <button id="settingsBtn" class="loopbtn loopbtn-square" title="Settings">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.59.22L3.28 8.87a.5.5 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.5.5 0 0 0-.12-.61l-2.01-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
      <span class="top-controls-btn-label" id="settingsBtnLabel">SET</span>
    </button>
  </div>
</div>
<div class="top-controls-spacer" id="topControlsSpacer"></div>

<script src="app.js"></script>
<script src="qn-nav.js"></script>
</body>
</html>
